apiVersion: v1
kind: Namespace
metadata:
  name: security-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: security-orchestrator
---
# Droits minimaux : lire les pods (pour cibler par labels) et gérer les politiques.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["security.kubearmor.com"]
    resources: ["kubearmorpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: security-orchestrator
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: security-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: security-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: {app: orchestrator}
  template:
    metadata:
      labels: {app: orchestrator}
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: security-orchestrator:2.0.0
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - {name: WATCHED_NAMESPACES, value: "demo"}
            # Warning et plus : blocage immédiat. Notice : audit + validation humaine.
            - {name: AUTO_BLOCK_PRIORITIES, value: "Emergency,Alert,Critical,Error,Warning"}
            - {name: POLICY_TTL_SECONDS, value: "900"}
            - {name: APPROVAL_WEBHOOK_URL, value: ""}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: security-orchestrator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector: {app: orchestrator}
  ports: [{port: 8080, targetPort: 8080}]
